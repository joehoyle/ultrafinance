[workspace]
members = ["crates/ultrafinance-core", "crates/ultrafinance-api", "crates/ultrafinance-cli"]
default-members = ["crates/ultrafinance-cli"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
anyhow = "1"
axum = "0.8"
clap = { version = "4.5", features = ["derive", "env"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time"] }
unicode-normalization = "0.1"
strsim = "0.11"
rapidfuzz = "0.5"
regex = "1"
uuid = { version = "1", features = ["v4"] }
csv = "1.4"
utoipa = "6"

postgres = "0.19"
postgres-native-tls = "0.5"
native-tls = "0.2"

# Fuzzy scoring is CPU-heavy; keep normal `cargo run` practical while retaining debug symbols.
[profile.dev.package.ultrafinance-core]
opt-level = 2

[profile.dev.package.strsim]
opt-level = 3

[profile.dev.package.serde_json]
opt-level = 2

[profile.dev.package.rapidfuzz]
opt-level = 3
