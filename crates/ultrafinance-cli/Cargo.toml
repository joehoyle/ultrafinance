[package]
name = "ultrafinance-cli"
default-run = "ultrafinance"
version.workspace = true
edition.workspace = true

[[bin]]
name = "ultrafinance"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
serde_json.workspace = true
serde.workspace = true
tokio.workspace = true
ultrafinance-core = { path = "../ultrafinance-core" }
uuid.workspace = true
comfy-table = "8"
base64 = "0.22"
tempfile = "3"
regex.workspace = true
reqwest.workspace = true
csv = "1"
sha2.workspace = true
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "ico", "gif"] }
scraper = "0.24"
resvg = { version = "0.48.1", default-features = false }
calamine = { version = "0.35", default-features = false }
zip = { version = "7", default-features = false, features = ["deflate"] }
inquire = { version = "0.9.4", default-features = false, features = ["crossterm", "fuzzy"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
