services:
  postgres:
    image: postgres:17
    # Disposable local development database: favor import speed over crash recovery.
    # Set all three ULTRAFINANCE_POSTGRES_* switches to on for durable commits.
    command:
      - postgres
      - -c
      - shared_buffers=4GB
      - -c
      - max_wal_size=4GB
      - -c
      - fsync=${ULTRAFINANCE_POSTGRES_FSYNC:-off}
      - -c
      - full_page_writes=${ULTRAFINANCE_POSTGRES_FULL_PAGE_WRITES:-off}
      - -c
      - synchronous_commit=${ULTRAFINANCE_POSTGRES_SYNCHRONOUS_COMMIT:-off}
    environment:
      POSTGRES_USER: ultrafinance
      POSTGRES_DB: ultrafinance
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ultrafinance -d ultrafinance"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  postgres_data:
