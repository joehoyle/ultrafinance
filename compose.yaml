services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ultrafinance
      POSTGRES_DB: ultrafinance
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ultrafinance -d ultrafinance"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  postgres_data:
